global:
  logging:
    - type: syslog
      format: human
      level: warn

jobs:
  - name: snapshot-datapool
    type: snap
    filesystems:
      "datapool<": true
    snapshotting:
      type: periodic
      interval: 10m
      prefix: zrepl_
    pruning:
      keep:
        - type: grid
          grid: 1x1h(keep=all) | 24x1h | 7x1d | 2x7d | 1x30d
          regex: "zrepl_.*"
        - type: regex
          negate: true
          regex: "^zrepl_.*"

  - name: push-usbbackup-datapool
    type: push
    filesystems:
      "datapool<": true
    snapshotting:
      type: manual
    pruning:
      keep_sender:
        - type: regex
          regex: ".*"
      keep_receiver:
        - type: grid
          grid: 1x1h(keep=all) | 48x1h | 14x1d | 4x7d | 3x30d
          regex: "^zrepl_.*"
        # - type: regex
        #   negate: true
        #   regex: "^zrepl_.*"
    connect:
      type: local
      listener_name: usbbackup_sink
      client_identity: hostname1
    # send:
    #   encrypted: true
    replication:
      protection:
        initial: guarantee_resumability
        incremental: guarantee_incremental

  - name: sink-usbbackup
    type: sink
    root_fs: "backuppool/replica"
    serve:
      type: local
      listener_name: usbbackup_sink
